name: SimpleCameraAutoSender
options:
  bundleIdPrefix: com.hejong2byte
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 23
    MARKETING_VERSION: 0.3.12
targets:
  SimpleCameraAutoSender:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: build/App-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejong2byte.simplecameraautosender
        PRODUCT_NAME: SimpleCameraAutoSender
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SimpleCamera 업무사진 전송
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Simple Cam 자동 사진과 직접 선택한 사진, 스크린샷 및 동영상을 전송하려면 사진 보관함 전체 접근이 필요합니다.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SimpleCameraAutoSenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SimpleCameraAutoSender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejong2byte.simplecameraautosender.tests
        GENERATE_INFOPLIST_FILE: YES
  SimpleCameraAutoSenderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SimpleCameraAutoSender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejong2byte.simplecameraautosender.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SimpleCameraAutoSender
schemes:
  SimpleCameraAutoSender:
    build:
      targets:
        SimpleCameraAutoSender: all
        SimpleCameraAutoSenderTests: [test]
        SimpleCameraAutoSenderUITests: [test]
    test:
      targets:
        - SimpleCameraAutoSenderTests
        - SimpleCameraAutoSenderUITests
