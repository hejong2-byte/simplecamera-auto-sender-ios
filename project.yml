name: SimpleCameraAutoSender
options:
  bundleIdPrefix: com.hejong2byte
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.3
targets:
  SimpleCameraAutoSender:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejong2byte.photolibraryautosender
        PRODUCT_NAME: SimpleCameraAutoSender
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 사진함 자동전송
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 지금부터 사진함에 추가되는 모든 이미지 원본을 자동 전송하려면 사진 보관함 전체 접근이 필요합니다.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SimpleCameraAutoSenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SimpleCameraAutoSender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejong2byte.photolibraryautosender.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SimpleCameraAutoSender:
    build:
      targets:
        SimpleCameraAutoSender: all
        SimpleCameraAutoSenderTests: [test]
    test:
      targets:
        - SimpleCameraAutoSenderTests
