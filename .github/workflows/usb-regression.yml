name: USB copy and cleanup regression
on:
  push:
    branches: ["codex/foreground-receive-alert"]
permissions:
  contents: read
jobs:
  usb:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: USB unit regression
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          DEVICE_ID="$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for ds in data["devices"].values() for d in ds if d["name"].startswith("iPhone")))')"
          xcodebuild test -project SimpleCameraAutoSender.xcodeproj -scheme SimpleCameraAutoSender \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -parallel-testing-enabled NO \
            -only-testing:SimpleCameraAutoSenderTests/IPhoneUSBExportServiceTests \
            -only-testing:SimpleCameraAutoSenderTests/USBReceiverViewModelTests \
            -only-testing:SimpleCameraAutoSenderTests/USBFolderCleanupServiceTests \
            -only-testing:SimpleCameraAutoSenderTests/IPhoneReceiveErrorMessageTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/usb-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: USB-regression-log
          path: build/usb-regression.log
          retention-days: 3
