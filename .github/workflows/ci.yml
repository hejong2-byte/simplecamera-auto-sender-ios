name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run iOS tests
        run: bash scripts/test-ios.sh
      - name: Build unsigned SideStore IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload IPA test artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCameraAutoSender-unsigned
          path: dist/SimpleCameraAutoSender.ipa
