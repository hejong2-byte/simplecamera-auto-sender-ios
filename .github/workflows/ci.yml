name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run iOS tests
        run: bash scripts/test-ios.sh
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/ui-test-attachments
          fi
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-test-screenshots
          path: build/ui-test-attachments
          retention-days: 3
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-test-results
          path: build/TestResults.xcresult
          retention-days: 3
      - name: Build unsigned SideStore IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload IPA test artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCameraAutoSender-unsigned
          path: dist/SimpleCameraAutoSender.ipa
